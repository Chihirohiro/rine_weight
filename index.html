<div class="app" id="app"><header class="top"><div class="topbar"><div class="brand"><div class="brand-symbol">✿</div><h1>体重日記</h1></div></div></header><main id="main"></main></div>
<div id="modal-host"></div><input id="avatar-picker-hidden" type="file" accept="image/*" hidden /><div id="toast-host"></div>
<script>
'use strict';
const SEED={};
const KEY='R1neWeightDiaryData_v1';
const AVATAR_KEY='R1neWeightDiaryAvatar_v2';
const FONT_KEY='R1neWeightDiaryFont_v2';
const ICONS={};
const weekday=['日','月','火','水','木','金','土'];
const periodOptions=[['1m','1m'],['2m','2m'],['3m','3m'],['6m','6m'],['1y','1y'],['2y','2y'],['3y','3y'],['all','全期間'],['year','年別']];
function validRecord(r){return r&&Number.isFinite(Number(r.weight))&&Number(r.weight)>0&&Number(r.weight)<500}
function normalizeRecord(r){return {weight:Number(r.weight),note:String(r.note||''),icons:Array.isArray(r.icons)?r.icons.filter(x=>Object.hasOwn(ICONS,x)):[]}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.records&&typeof s.records==='object')return {settings:{height:0,goal:60,...s.settings},records:s.records}}catch(e){console.warn(e)}return {settings:{height:0,goal:60},records:structuredClone(SEED)}}
let store=load(),view='diary',month=new Date(),graphPeriod='3y',graphYear=new Date().getFullYear(),listYear='all',sortNewest=true,query='',editing=null;
let userPickedMonth=false; let userPickedGraph=false;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const today=()=>{let d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){alert('保存できませんでした。ブラウザの空き容量やプライベートモードを確認してね。');return false}}
function bmi(v){const h=Number(store.settings.height)/100;return h>0&&v? (Number(v)/(h*h)).toFixed(2):'—'}
const kg=v=>v==null?'—':Number(v).toFixed(1)+'kg';
function dates(){return Object.keys(store.records).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&validRecord(store.records[d])).sort()}
function entries(){return dates().map(date=>({date,...normalizeRecord(store.records[date])}))}
function latest(){const d=dates();return d.length?{date:d[d.length-1],...store.records[d[d.length-1]]}:null}
function findDays(y,m){return dates().filter(d=>d.startsWith(`${y}-${pad(m)}-`))}
function icon(code, cls=''){const all={diary:'<path d="M4 4h16v16H4z"/><path d="M8 4v16M11 9h6M11 13h6"/>',entry:'<path d="M8 4h12v15H6V6"/><path d="M4 15l-1 5 5-1L20 7l-4-4z"/>',graph:'<path d="M3 20V4M3 20h18M6 15l4-6 5 3 5-8"/><circle cx="6" cy="15" r="1"/><circle cx="10" cy="9" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="20" cy="4" r="1"/>',list:'<path d="M9 6h12M9 12h12M9 18h12M3 6h2M3 12h2M3 18h2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>'};return `<svg aria-hidden="true" viewBox="0 0 24 24" class="${cls}">${all[code]||''}</svg>`}
const portrait=`<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="#c0c3db" d="M22 77q-3-35 20-42l11 23 11-23q22 9 16 42l-14 12H35z"/><path fill="#fff" stroke="#9c9eb8" stroke-width="1.5" d="M28 42q-10-26 15-30 25-7 26 19 5 16-17 22-14 3-24-11z"/><path fill="none" stroke="#959ab7" stroke-width="2" d="M23 34q11-17 25-12 15 3 23-7M27 30q-6 14 7 18M58 24q-1 18 13 23"/><circle cx="42" cy="37" r="2" fill="#767c94"/><circle cx="59" cy="37" r="2" fill="#767c94"/><path d="M47 45q4 3 8 0" fill="none" stroke="#a9959b" stroke-linecap="round" stroke-width="1.5"/><circle cx="36" cy="43" r="5" fill="#f6c8d4" opacity=".6"/><circle cx="66" cy="43" r="5" fill="#f6c8d4" opacity=".6"/><path d="M33 73l15 17m22-19L60 90" fill="none" stroke="#858ab3" stroke-width="3"/><path d="M81 20l2 8 8 2-8 2-2 8-2-8-8-2 8-2z" fill="#e7b4c9"/></svg>`;
function header(){const subtitle=view==='diary'?'日記':view==='entry'?'今日入力':view==='graph'?'グラフ':view==='list'?'記録した日だけ':'設定';const y=month.getFullYear(),m=month.getMonth()+1;return `<header class="top"><div class="topbar"><div class="brand"><div class="brand-symbol">✿</div><h1>${subtitle}</h1></div><small>ずっと残せる体重日記</small></div>${view==='diary'?`<div class="monthnav"><button type="button" data-action="prev-month" aria-label="前月">←</button><button type="button" class="month-choose" data-action="choose-month" aria-label="年と月を選択">${y===new Date().getFullYear()&&m===new Date().getMonth()+1?'今月':y+'年'+m+'月'} <span>⌄</span></button><button type="button" data-action="next-month" aria-label="翌月">→</button></div>`:''}</header>`}
function footer(){return `<nav class="nav" aria-label="ページ"><button data-view="entry" class="${view==='entry'?'active':''}">${icon('entry')}<span>今日入力</span></button><button data-view="diary" class="${view==='diary'?'active':''}">${icon('diary')}<span>日記</span></button><button data-view="graph" class="${view==='graph'?'active':''}">${icon('graph')}<span>グラフ</span></button><button data-view="list" class="${view==='list'?'active':''}">${icon('list')}<span>記録一覧</span></button><button data-view="settings" class="${view==='settings'?'active':''}">${icon('settings')}<span>設定</span></button></nav>`}
function render(){ $('app').innerHTML=header()+`<main id="main">${view==='diary'?diaryPage():view==='entry'?entryPage():view==='graph'?graphPage():view==='list'?listPage():settingsPage()}</main>`+footer()+(view==='diary'?`<button class="floating-add" data-action="new-today" aria-label="体重を入力">＋</button>`:''); }
function summaryHero(e, title){return `<section class="hero"><button type="button" class="avatar" data-action="pick-avatar" aria-label="アイコン画像を選ぶ">${localStorage.getItem(AVATAR_KEY)?`<img src="${localStorage.getItem(AVATAR_KEY)}" alt="設定したアイコン"/>`:`<span class="avatar-placeholder">＋<small>画像を選ぶ</small></span>`}</button><div class="hero-body"><div class="sub">${safe(title)}</div><div class="big">${e?kg(e.weight):'記録なし'}</div><div class="note ${e?.note?'':'no-note'}">${e?.note?'✎ '+safe(e.note):'ひとこと日記も残せます'}</div>${e?`<div class="today-tag">${safe(e.date)} の記録</div>`:''}</div></section>`}
function bmiStrip(e){let value=e?Number(bmi(e.weight)):NaN;let category=!e?-1:value<18.5?0:value<25?1:value<30?2:value<35?3:value<40?4:5;const categories=['痩せ型','普通体重','肥満 (1度)','肥満 (2度)','肥満 (3度)','肥満 (4度)'];return `<div class="bmi-strip"><div class="bmi-title">BMI</div>${categories.map((name,i)=>`<div class="bmi-category ${i===category?'current '+(i>=2?'high':''):''}"><small>${name}</small><span>${i===category?bmi(e.weight):'　'}</span></div>`).join('')}</div>`}
function utc(s){return Date.parse(s+'T00:00:00Z')}
function jsDateToIso(d){return iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
function offsetDate(n){const d=new Date();d.setMonth(d.getMonth()-n);return jsDateToIso(d)}
function plotSVG(data,from,to,goal){let W=750,H=330,L=47,R=12,T=13,B=38,plotH=H-T-B;let x0=utc(from),x1=utc(to);if(!Number.isFinite(x0)||x1<=x0)x1=x0+86400000;let ys=[goal,...data.map(r=>Number(r.weight))].filter(Number.isFinite);let min=Math.floor((Math.min(...ys,50)-2)/5)*5;let max=Math.ceil((Math.max(...ys,60)+2)/5)*5;if(max<=min)max=min+10;let x=date=>L+(W-L-R)*(utc(date)-x0)/(x1-x0), y=v=>T+plotH*(max-Number(v))/(max-min);const txt=(x,y,s,size=13,anchor='end')=>`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="#8a8d92">${safe(s)}</text>`;let s=`<svg class="plot-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${safe(from)}から${safe(to)}までの体重推移">`;for(let tick=min;tick<=max+0.01;tick+=5){s+=`<line x1="${L}" x2="${W-R}" y1="${y(tick)}" y2="${y(tick)}" stroke="#aaa" stroke-width=".9"/>`+txt(L-5,y(tick)+4,tick.toFixed(1)+'kg',12)}let nt=5;for(let i=0;i<=nt;i++){let t=x0+(x1-x0)*i/nt,dt=new Date(t);let dd=dt.getUTCDate(),mo=dt.getUTCMonth()+1,yy=dt.getUTCFullYear();let label=(x1-x0>1000*86400000)?`${yy}年`:(x1-x0>120*86400000)?`${yy%100}/${mo}`:`${mo}/${dd}`;let px=L+(W-L-R)*i/nt;s+=`<line x1="${px}" x2="${px}" y1="${T}" y2="${T+plotH}" stroke="#b8bcc0" stroke-width=".8"/>`+txt(px,T+plotH+23,label,12,'middle')}
s+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#2a3be6" stroke-width="2.3" stroke-dasharray="6 5"/>`;
const xy=data.filter(r=>utc(r.date)>=x0&&utc(r.date)<=x1).map(r=>[x(r.date),y(r.weight),r]);if(xy.length>1)s+=`<polyline fill="none" stroke="#4c7d90" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${xy.map(p=>p.slice(0,2).join(',')).join(' ')}"/>`;
for(const [px,py,e] of xy){s+=`<circle cx="${px}" cy="${py}" r="${xy.length>100?2.6:xy.length>40?3.5:5}" fill="#4c7d90" data-date="${e.date}" role="button" tabindex="0"><title>${e.date} ${kg(e.weight)} ${safe(e.note||'')}</title></circle>`}
s+='</svg>';return s}
function monthlySVG(y,m){const first=iso(y,m,1),last=iso(y,m,new Date(y,m,0).getDate()),d=entries().filter(x=>x.date>=first&&x.date<=last);return plotSVG(d,first,last,Number(store.settings.goal)||45)}
function monthHero(y,m){const d=findDays(y,m);const e=d.length?{date:d[d.length-1],...store.records[d[d.length-1]]}:null;return summaryHero(e,`${y}年${m}月の最新記録`)+bmiStrip(e)}
function diaryPage(){let y=month.getFullYear(),m=month.getMonth()+1,total=new Date(y,m,0).getDate(),items=Array.from({length:total},(_,i)=>i+1),d=findDays(y,m),thisday=today();
return monthHero(y,m)+`<div class="section-head">${y}年${m}月の詳細</div><div class="chart-wrap">${monthlySVG(y,m)}<div class="legend"><span><i></i>体重</span><span class="goal"><i></i>目標体重</span></div></div><table class="diary-table"><thead><tr><th>日付</th><th>体重</th><th>BMI</th><th>日記</th></tr></thead><tbody>${items.map(n=>{let date=iso(y,m,n),r=store.records[date],wk=new Date(y,m-1,n).getDay();return `<tr data-date="${date}" class="${date===thisday?'current-day':''}" title="タップして記録を編集"><td class="${wk===0?'sun':wk===6?'weekend':''}">${n}(${weekday[wk]})</td><td class="weight">${r?kg(r.weight):''}</td><td class="bmi">${r?bmi(r.weight):''}</td><td class="memo">${safe(r?.note||'')}</td></tr>`}).join('')}</tbody></table><div class="small-month-info">${y}年${m}月：${d.length}件の記録（空欄の日もタップで入力できます）</div><div class="copyright-note">オリジナルのイラストを使用した、個人用の体重日記です。</div>`}
function entryPage(){const d=today(),r=store.records[d];return `<section class="page entry-page"><div class="entry-cover"><button type="button" class="cover-upload" data-action="pick-avatar" aria-label="好きな画像を選ぶ">${localStorage.getItem(AVATAR_KEY)?`<img src="${localStorage.getItem(AVATAR_KEY)}" alt="設定した画像">`:'<span>＋<small>好きな画像を追加</small></span>'}</button></div><div class="today-display"><div class="display-date">${safe(d.replace(/-/g,'/'))}</div><div class="display-weight user-written">${r?Number(r.weight).toFixed(1):'—'}<small> kg</small></div>${r?.note?`<div class="display-note user-written">✎ ${safe(r.note)}</div>`:''}</div><h2 class="edit-heading">今日の記録を編集</h2><div class="card soft"><div id="entry-form">${entryForm(d,r)}</div></div><div class="subhead">最近の記録</div>${entries().slice(-5).reverse().map(recordRow).join('')}</section>`}
function entryForm(date,r){return `<form id="record-form"><div class="form-grid"><div class="field"><label for="record-date">日付</label><input id="record-date" type="date" value="${safe(date)}" required /></div><div class="field"><label for="record-weight">体重 (kg)</label><input id="record-weight" type="number" inputmode="decimal" min="1" max="499" step="0.1" placeholder="例：55.9" value="${r?Number(r.weight).toFixed(1):''}" required /></div></div><div class="field"><label for="record-note">ひとこと日記（任意）</label><textarea id="record-note" placeholder="今日のことを書いてね">${safe(r?.note||'')}</textarea></div><div class="btnrow"><button type="submit" class="btn primary">保存する</button>${r?'<button type="button" class="btn danger" data-action="delete-from-form">この日の記録を削除</button>':''}</div></form>`}
function range(){let t=today(),d=new Date();if(graphPeriod==='all'){let all=dates();return [all[0]||t,t]};if(graphPeriod==='year')return [iso(graphYear,1,1),iso(graphYear,12,31)];let n=Number(graphPeriod.replace(/[my]/g,''));let from=new Date();if(graphPeriod.endsWith('y'))from.setFullYear(from.getFullYear()-n);else from.setMonth(from.getMonth()-n);return [jsDateToIso(from),t]}
function graphPage(){let [from,to]=range(),es=entries().filter(r=>r.date>=from&&r.date<=to),start=es[0],end=es[es.length-1],lowest=es.length?Math.min(...es.map(r=>r.weight)):null,highest=es.length?Math.max(...es.map(r=>r.weight)):null;let years=[...new Set(dates().map(x=>Number(x.slice(0,4))))];if(!years.includes(new Date().getFullYear()))years.push(new Date().getFullYear());years.sort((a,b)=>b-a);return `<section class="page"><h2>グラフ</h2><div class="tabstrip">${periodOptions.map(([value,label])=>`<button class="${graphPeriod===value?'active':''}" data-period="${value}">${label}</button>`).join('')}</div>${graphPeriod==='year'?`<div class="field"><label for="graph-year">表示する年</label><select id="graph-year">${years.map(y=>`<option value="${y}" ${graphYear===y?'selected':''}>${y}年</option>`).join('')}</select></div>`:''}<div class="card"><div class="mini">${safe(from)} 〜 ${safe(to)}</div><div class="chart-wrap">${plotSVG(es,from,to,Number(store.settings.goal)||45)}<div class="legend"><span><i></i>体重</span><span class="goal"><i></i>目標体重</span></div></div><div class="mini-stat"><div>記録数<strong>${es.length}件</strong></div><div>最小<strong>${kg(lowest)}</strong></div><div>最大<strong>${kg(highest)}</strong></div></div>${es.length?'<p class="hint">グラフの点をタップすると、その日の記録を編集できます。記録のない日は推測で埋めていません。</p>':'<p class="empty">この期間の記録はまだありません。</p>'}</div><p class="intro">「全期間」で2021年からの全記録が見られます。年別表示にも期間制限はありません。</p></section>`}
function recordRow(e){let dt=new Date(e.date+'T12:00:00');return `<div class="record" data-date="${e.date}" role="button" tabindex="0"><div class="rec-date">${e.date.slice(0,4)}<br>${Number(e.date.slice(5,7))}月${Number(e.date.slice(8,10))}日(${weekday[dt.getDay()]})</div><div class="rec-content"><strong>${kg(e.weight)}</strong> <span class="rec-bmi">BMI ${bmi(e.weight)}</span>${e.note?`<p>${safe(e.note)}</p>`:''}</div><span class="rec-arrow">›</span></div>`}
function listPage(){let es=entries();let years=[...new Set(es.map(r=>r.date.slice(0,4)))].reverse();if(listYear!=='all')es=es.filter(r=>r.date.startsWith(listYear));if(query.trim()){let q=query.trim().toLowerCase();es=es.filter(r=>r.date.includes(q)||r.note.toLowerCase().includes(q)||String(r.weight).includes(q))}if(sortNewest)es.reverse();return `<section class="page"><h2>記録した日だけ</h2><p class="intro">空欄の日を飛ばして、記録がある日だけ一覧表示します。タップで編集できます。</p><div class="date-filter"><div class="field" style="flex:1;margin:0"><label for="list-year">年で絞り込み</label><select id="list-year"><option value="all">すべての年</option>${years.map(y=>`<option value="${y}" ${listYear===y?'selected':''}>${y}年</option>`).join('')}</select></div><button class="btn" data-action="toggle-order">${sortNewest?'↓ 新しい順':'↑ 古い順'}</button></div><div class="field" style="margin-top:12px"><label for="search-records">日付・体重・コメントで検索</label><input id="search-records" placeholder="例：2023-11 / 55.9 / バイト" value="${safe(query)}" /></div><div class="mini">${es.length}件を表示中 / 全${dates().length}件</div><div class="card" style="padding:0;overflow:hidden">${es.length?es.map(recordRow).join(''):'<div class="empty">該当する記録はありません。</div>'}</div></section>`}
function settingsPage(){const h=store.settings.height,g=store.settings.goal;return `<section class="page"><h2>設定</h2><div class="card"><form id="settings-form"><div class="field"><label for="height">身長 (cm) — 変更するとBMIをすべて自動再計算</label><input id="height" type="number" inputmode="decimal" step="0.1" min="50" max="240" value="${safe(h||'')}" required /><p class="smallprint">身長を入力するとBMIが自動計算されます。</p></div><div class="field"><label for="goal">目標体重 (kg)</label><input id="goal" type="number" inputmode="decimal" step="0.1" min="1" max="499" value="${safe(g||45)}" required /></div><button class="btn primary" type="submit">設定を保存</button></form></div><div class="subhead">見た目のカスタマイズ</div><div class="card"><div class="field"><label for="avatar-file">アイコン画像（端末内に保存）</label><input id="avatar-file" type="file" accept="image/*" /></div><button type="button" class="btn" data-action="clear-avatar">画像を削除</button><div class="field" style="margin-top:15px"><label for="font-file">入力した内容のフォント（Pomeranian-Regular.ttf を選択）</label><input id="font-file" type="file" accept=".otf,.ttf,.woff,.woff2,font/*" /></div><p class="smallprint">送ってくれたPomeranianフォントを選ぶと、体重・ひとこと日記など入力した内容だけに適用されます。フォントはこの端末内だけに保存され、GitHubには公開されません。</p><button type="button" class="btn" data-action="clear-font">フォント設定を戻す</button></div><div class="subhead">データのバックアップ</div><div class="backup-block"><p class="intro">記録はこのブラウザ内に保存されます。機種変更やブラウザのデータ消去に備えて、定期的にJSONを保存してね。</p><div class="btnrow"><button class="btn primary" data-action="export-json">JSONでバックアップ</button><button class="btn" data-action="export-csv">CSVで書き出し</button></div><div class="field" style="margin-top:15px"><label for="restore-file">JSONバックアップを読み込む（既存データと結合）</label><input type="file" accept="application/json,.json" id="restore-file" /></div><div class="mini">同じ日付は読み込むファイルの記録で更新されます。設定もバックアップに含まれていれば復元します。</div></div><div class="subhead">全記録</div><div class="card"><p>保存件数：<strong>${dates().length} 件</strong></p><p>最古：<strong>${dates()[0]||'—'}</strong></p><p>最新：<strong>${dates().at(-1)||'—'}</strong></p><p class="smallprint">3年の制限はありません。2021年より前の日付も登録できます。</p><div class="cut"></div><button class="btn danger" data-action="reset-data">すべての記録を削除</button><p class="smallprint warning">初期化すると編集・追加した内容は消えます。先にバックアップを保存してください。</p></div><div class="copyright-note">個人向け・オフライン対応ウェブアプリ。スクショにある既存アプリの絵柄やイラストは使用していません。</div></section>`}
function showToast(msg){$('toast-host').innerHTML=`<div class="toast" role="status">${safe(msg)}</div>`;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('toast-host').innerHTML='',2500)}
function editRecord(date){const r=store.records[date];editing=date;$('modal-host').innerHTML=`<div class="modal-layer" id="modal-layer"><div class="modal" role="dialog" aria-modal="true" aria-label="記録の編集"><div class="modal-top"><h2>${safe(date)} の記録</h2><button class="close" data-action="close-modal" aria-label="閉じる">×</button></div>${entryForm(date,r)}</div></div>`;setTimeout(()=>$('record-weight')?.focus(),80)}
function closeModal(){editing=null;$('modal-host').innerHTML=''}
function getFormIcons(form){return Array.from(form.querySelectorAll('.pill.selected')).map(x=>x.dataset.icon)}
function saveRecord(form){let date=form.querySelector('#record-date').value,weight=Number(form.querySelector('#record-weight').value),note=form.querySelector('#record-note').value,icons=[];if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(weight)||weight<=0||weight>499){alert('日付と体重を確認してね。');return} if(editing&&date!==editing&&store.records[date]&&!confirm(`${date}に別の記録があります。上書きしますか？`))return;if(editing&&date!==editing)delete store.records[editing];store.records[date]={weight,note,icons};if(save()){closeModal();render();showToast('記録を保存しました ✓')}}
function deleteRecord(form){let date=form.querySelector('#record-date').value;if(!store.records[date])return;if(!confirm(`${date}の記録を削除しますか？`))return;delete store.records[date];save();closeModal();render();showToast('記録を削除しました')}
function downloadFile(content,name,type){const blob=new Blob([content],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function exportData(type){const suffix=today();if(type==='json'){downloadFile(JSON.stringify({app:'R1ne Weight Diary',version:1,exportedAt:new Date().toISOString(),...store},null,2),`体重日記-backup-${suffix}.json`,'application/json;charset=utf-8');showToast('JSONを保存しました')}else{const header=['date','weight_kg','bmi','note'],rows=entries().map(e=>[e.date,e.weight,bmi(e.weight),e.note]);const csv=[header,...rows].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');downloadFile('\ufeff'+csv,`体重日記-${suffix}.csv`,'text/csv;charset=utf-8');showToast('CSVを保存しました')}}
async function importJSON(file){if(!file)return;let raw;try{raw=JSON.parse(await file.text())}catch(e){alert('JSONファイルを読み込めませんでした。');return}const source=raw.records||raw; if(!source||typeof source!=='object'||Array.isArray(source)){alert('体重日記のJSONファイルを指定してね。');return}let valid={};for(const [date,r] of Object.entries(source)){if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&validRecord(r))valid[date]=normalizeRecord(r)}let n=Object.keys(valid).length;if(n===0){alert('読み込める体重記録がありません。');return}if(!confirm(`${n}件の記録を読み込みます。既存と同じ日付は上書きします。よろしいですか？`))return;store.records={...store.records,...valid};if(raw.settings&&typeof raw.settings==='object'){let h=Number(raw.settings.height),g=Number(raw.settings.goal);if(h>=50&&h<=240)store.settings.height=h;if(g>0&&g<500)store.settings.goal=g}save();render();showToast(`${n}件を読み込みました`)}
function initEvents(){document.addEventListener('click',e=>{const node=e.target.closest('[data-view],[data-action],[data-date],[data-period],[data-icon]');if(!node)return;if(node.dataset.view){view=node.dataset.view;render();scrollTo(0,0);return}if(node.dataset.icon){node.classList.toggle('selected');node.setAttribute('aria-pressed',node.classList.contains('selected')?'true':'false');return}if(node.dataset.period){graphPeriod=node.dataset.period;render();return}if(node.dataset.date){editRecord(node.dataset.date);return}let act=node.dataset.action;if(act==='prev-month'||act==='next-month'){month=new Date(month.getFullYear(),month.getMonth()+(act==='prev-month'?-1:1),1);render()}if(act==='new-today')editRecord(today());if(act==='choose-month')openMonthPicker();if(act==='pick-avatar')$('avatar-picker-hidden').click();if(act==='clear-avatar'){localStorage.removeItem(AVATAR_KEY);render()}if(act==='clear-font'){localStorage.removeItem(FONT_KEY);location.reload()}if(act==='close-modal')closeModal();if(act==='delete-from-form')deleteRecord(node.closest('form'));if(act==='toggle-order'){sortNewest=!sortNewest;render()}if(act==='export-json')exportData('json');if(act==='export-csv')exportData('csv');if(act==='reset-data'){if(confirm('本当に初期記録に戻しますか？ 変更したデータは消えます。バックアップ済みですか？')&&confirm('最終確認：初期状態に戻しますか？')){store={settings:{height:0,goal:60},records:{}};save();render();showToast('すべての記録を削除しました')}}});document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();saveRecord(e.target)}if(e.target.id==='settings-form'){e.preventDefault();let h=Number($('height').value),g=Number($('goal').value);if(h<50||h>240||g<=0||g>499){alert('身長・目標体重を確認してね。');return}store.settings.height=h;store.settings.goal=g;save();render();showToast('設定を保存しました')}});document.addEventListener('change',e=>{if(e.target.id==='record-date'&&view==='entry'&&!editing){const date=e.target.value;let existing=store.records[date];const f=$('record-form');if(f){f.querySelector('#record-weight').value=existing?Number(existing.weight).toFixed(1):'';f.querySelector('#record-note').value=existing?.note||'';for(const b of f.querySelectorAll('[data-icon]'))b.classList.toggle('selected',Boolean(existing?.icons?.includes(b.dataset.icon)))}}if(e.target.id==='list-year'){listYear=e.target.value;render()}if(e.target.id==='graph-year'){graphYear=Number(e.target.value);render()}if(e.target.id==='restore-file'){importJSON(e.target.files[0])}if(e.target.id==='avatar-file'||e.target.id==='avatar-picker-hidden')uploadAvatar(e.target.files[0]);if(e.target.id==='font-file')uploadFont(e.target.files[0]);if(e.target.id==='month-year'||e.target.id==='month-number'){const y=Number($('month-year')?.value),m=Number($('month-number')?.value);if(y>=1&&m>=1&&m<=12){month=new Date(y,m-1,1);closeModal();render()}}});document.addEventListener('input',e=>{if(e.target.id==='search-records'){query=e.target.value;const start=e.target.selectionStart;render();let f=$('search-records');f?.focus();f?.setSelectionRange(start,start)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.record')){e.preventDefault();editRecord(e.target.dataset.date)}});document.addEventListener('click',e=>{if(e.target.id==='modal-layer')closeModal()});}
function openMonthPicker(){const y=month.getFullYear(),m=month.getMonth()+1;const years=Array.from({length:Math.max(2026,new Date().getFullYear())-1970+31},(_,i)=>1970+i).reverse();$('modal-host').innerHTML=`<div class="modal-layer" id="modal-layer"><div class="modal month-modal"><div class="modal-top"><h2>年月を選ぶ</h2><button class="close" data-action="close-modal">×</button></div><div class="form-grid"><div class="field"><label for="month-year">年</label><select id="month-year">${years.map(n=>`<option value="${n}" ${n===y?'selected':''}>${n}年</option>`).join('')}</select></div><div class="field"><label for="month-number">月</label><select id="month-number">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${i+1}月</option>`).join('')}</select></div></div><button class="btn primary" data-action="close-modal">閉じる</button></div></div>`}
async function uploadAvatar(file){if(!file)return;if(!file.type.startsWith('image/')){alert('画像を選んでください');return}try{const img=await createImageBitmap(file);const cv=document.createElement('canvas');const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);localStorage.setItem(AVATAR_KEY,cv.toDataURL('image/jpeg',.79));render();showToast('画像を変更しました')}catch(e){alert('画像を保存できませんでした')}}
async function uploadFont(file){if(!file)return;if(!/\.(otf|ttf|woff2?)$/i.test(file.name)){alert('フォントファイルを選んでください');return}if(file.size>3500000){alert('フォントのサイズが大きすぎます');return}const reader=new FileReader();reader.onload=()=>{try{localStorage.setItem(FONT_KEY,reader.result);applyFont();showToast('フォントを変更しました')}catch(e){alert('フォントを保存できませんでした')}};reader.readAsDataURL(file)}
function applyFont(){const f=localStorage.getItem(FONT_KEY);if(!f)return;let el=$('custom-font-style');if(!el){el=document.createElement('style');el.id='custom-font-style';document.head.appendChild(el)}el.textContent=`@font-face{font-family:UserCustom;src:url("${f}")}.user-written,#record-weight,#record-note,.diary-table td.weight,.diary-table td.memo,.rec-content strong,.rec-content p{font-family:UserCustom,sans-serif!important}`}
render();initEvents();applyFont();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker',e));
</script>
